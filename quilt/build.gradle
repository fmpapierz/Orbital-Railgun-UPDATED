plugins { id 'net.fabricmc.fabric-loom' }

repositories {
    maven { url = 'https://maven.quiltmc.org/repository/release/' }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    runtimeOnly "org.quiltmc:quilt-loader:${quilt_loader_version}"
    // Quilt's installer dependencies are not declared in its Maven POM.
    runtimeOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    runtimeOnly 'org.quiltmc:quilt-json5:1.0.4+final'
    runtimeOnly 'org.quiltmc:quilt-config:1.3.3'
    runtimeOnly 'io.github.llamalad7:mixinextras-fabric:0.5.5'
    ['asm', 'asm-analysis', 'asm-commons', 'asm-tree', 'asm-util'].each {
        runtimeOnly "org.ow2.asm:${it}:9.10.1"
    }
}
configurations.runtimeClasspath {
    exclude group: 'net.fabricmc', module: 'fabric-loader'
}
sourceSets.main {
    java.srcDir project(':common').file('src/main/java')
    java.srcDir project(':fabric').file('src/main/java')
    resources.srcDir project(':common').file('src/main/resources')
}
loom {
    runs {
        client {
            runDir 'run'
            mainClass = 'org.quiltmc.loader.impl.launch.knot.KnotClient'
            property 'loader.development', 'true'
        }
        server {
            runDir 'run-server'
            mainClass = 'org.quiltmc.loader.impl.launch.knot.KnotServer'
            property 'loader.development', 'true'
        }
    }
}
