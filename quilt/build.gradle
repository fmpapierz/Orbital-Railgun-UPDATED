plugins { id 'net.fabricmc.fabric-loom' }

repositories {
    maven { url = 'https://maven.quiltmc.org/repository/release/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "org.quiltmc:quilt-loader:${quilt_loader_version}"
    implementation 'net.fabricmc.fabric-api:fabric-api-base:2.0.4+ece063239e'
    implementation 'net.fabricmc.fabric-api:fabric-creative-tab-api-v1:5.0.14+d871b99e9e'
    implementation 'net.fabricmc.fabric-api:fabric-networking-api-v1:6.3.3+72073ef09e'
    implementation 'net.fabricmc.fabric-api:fabric-registry-sync-v0:7.1.0+c7bd5b8e9e'
    implementation 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    implementation 'org.quiltmc:quilt-json5:1.0.4+final'
    implementation 'org.quiltmc:quilt-config:1.3.3'
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-analysis:9.10.1'
    implementation 'org.ow2.asm:asm-commons:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.ow2.asm:asm-util:9.10.1'
    runtimeOnly 'io.github.llamalad7:mixinextras-fabric:0.5.5'
}

sourceSets.main {
    java.srcDir project(':common').file('src/main/java')
    resources.srcDir project(':common').file('src/main/resources')
}

loom {
    runs {
        client { runDir 'run' }
        server { runDir 'run-server' }
    }
}

// Fabric Loom does not emit Quilt Loader's development discovery arguments.
// Give Quilt the mod resources and required Fabric API modules explicitly so
// its Fabric compatibility plugin can discover them on development runs.
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    doFirst {
        def fabricApiJars = configurations.runtimeClasspath.files.findAll {
            it.absolutePath.contains("${File.separator}net.fabricmc.fabric-api${File.separator}")
        }
        if (fabricApiJars.empty) throw new GradleException('Could not locate Fabric API modules for the Quilt run')
        def quiltModResources = sourceSets.main.output.resourcesDir
        def addedMods = ([quiltModResources] + fabricApiJars).collect { it.absolutePath }.join(File.pathSeparator)
        jvmArgs "-Dloader.addMods=${addedMods}"
    }
}
